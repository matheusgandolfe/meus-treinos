<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meus Treinos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
  --accent:#c8f542;--accent-dim:#a8d030;--text:#f0f0f0;--text2:#888;
  --text3:#555;--red:#ff5c5c;--blue:#5c9fff;--orange:#f5a642;
  --radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:90px}
.header{padding:20px 20px 0;position:sticky;top:0;background:var(--bg);z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.05em}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--text2)}
.streak-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.tab{flex:1;padding:7px 4px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.tab.active{background:var(--accent);color:#111}
.section{display:none;padding:0 20px}
.section.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-title{font-size:13px;font-weight:500;color:var(--text2);font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;margin-top:4px}

/* Cloud */
.cloud-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:14px;font-family:'DM Mono',monospace}
.cloud-bar.syncing{background:rgba(92,159,255,.08);color:var(--blue);border:1px solid rgba(92,159,255,.15)}
.cloud-bar.ok{background:rgba(200,245,66,.07);color:var(--accent);border:1px solid rgba(200,245,66,.15)}
.cloud-bar.err{background:rgba(255,92,92,.08);color:var(--red);border:1px solid rgba(255,92,92,.15)}
.cloud-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.cloud-dot.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Hoje */
.day-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.workout-title{font-size:22px;font-weight:600;margin-bottom:4px}
.workout-meta{font-size:13px;color:var(--text2);margin-bottom:5px}
.progress-bar-wrap{background:var(--surface2);border-radius:99px;height:6px;margin-top:12px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:6px}
.dia-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.dia-btn{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.dia-btn.active{background:rgba(200,245,66,.15);border-color:var(--accent);color:var(--accent)}
.dia-btn.descanso-btn.active{background:rgba(255,92,92,.1);border-color:var(--red);color:var(--red)}

/* Checklist */
.ex-card{background:var(--surface2);border-radius:var(--radius-sm);padding:14px;margin-bottom:8px;border:1px solid transparent;transition:all .2s}
.ex-card.done-card{border-color:rgba(200,245,66,.2);opacity:.6}
.ex-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ex-name{font-weight:600;font-size:14px;flex:1;line-height:1.3}
.ex-check-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:14px;color:transparent}
.ex-check-btn.done{background:var(--accent);border-color:var(--accent);color:#111}
.series-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.serie-badge{font-size:11px;padding:4px 9px;border-radius:99px;font-family:'DM Mono',monospace;white-space:nowrap}
.serie-aquec{background:rgba(92,159,255,.12);color:var(--blue)}
.serie-ajuste{background:rgba(245,166,66,.12);color:var(--orange)}
.serie-trabalho{background:rgba(200,245,66,.15);color:var(--accent)}
.note-badge{font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--text3);display:inline-block;margin-top:4px}
.ex-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-video{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid rgba(92,159,255,.3);background:rgba(92,159,255,.08);color:var(--blue);font-size:12px;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-video:hover{background:rgba(92,159,255,.18)}

/* Form */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;font-family:'DM Mono',monospace;letter-spacing:.04em}
.form-input,.form-select{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;appearance:none}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--text3)}
.academia-row{display:flex;gap:8px;align-items:flex-end}
.academia-row .form-select{flex:1}

/* Linha exercício = select + botão + */
.ex-select-row{display:flex;gap:8px;align-items:flex-end}
.ex-select-row .form-select{flex:1}
.btn-add-ex{width:46px;height:46px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.btn-add-ex:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon{width:46px;height:46px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}

/* Tabela séries */
.series-table{width:100%;border-collapse:collapse;margin-top:4px}
.series-table th{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;text-align:left;padding:0 6px 8px;font-weight:500;letter-spacing:.04em}
.series-table td{padding:4px 6px}
.tipo-pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;font-family:'DM Mono',monospace;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.tipo-pill.aquecimento{background:rgba(92,159,255,.12);color:var(--blue);border-color:rgba(92,159,255,.2)}
.tipo-pill.ajuste{background:rgba(245,166,66,.12);color:var(--orange);border-color:rgba(245,166,66,.2)}
.tipo-pill.trabalho{background:rgba(200,245,66,.15);color:var(--accent);border-color:rgba(200,245,66,.2)}
.mini-input{width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Mono',monospace;font-size:14px;outline:none;text-align:center;transition:border-color .2s}
.mini-input:focus{border-color:var(--accent)}
.mini-input::placeholder{color:var(--text3);font-size:12px}
.add-serie-btn{display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;color:var(--text3);font-size:13px;border:none;background:transparent;width:100%;transition:color .2s}
.add-serie-btn:hover{color:var(--accent)}
.add-serie-btn .plus{width:24px;height:24px;border-radius:50%;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.add-serie-btn:hover .plus{border-color:var(--accent)}
.remove-serie{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0 4px;line-height:1;transition:color .15s}
.remove-serie:hover{color:var(--red)}

.btn-primary{width:100%;padding:14px;background:var(--accent);color:#111;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:8px}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);padding:8px 14px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--text2);color:var(--text)}
.btn-danger{background:transparent;border:1px solid #3a1a1a;color:var(--red);border-radius:var(--radius-sm);padding:6px 12px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer}

/* Criador de treino */
.treino-card-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.treino-card-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border-color .2s}
.treino-card-item:hover,.treino-card-item.active-treino{border-color:var(--accent)}
.treino-card-item.active-treino .treino-card-name{color:var(--accent)}
.treino-card-name{font-weight:600;font-size:14px}
.treino-card-meta{font-size:12px;color:var(--text3);margin-top:2px}
.treino-card-actions{display:flex;gap:6px}
.new-treino-btn{width:100%;padding:12px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;text-align:center;transition:all .2s;margin-bottom:16px}
.new-treino-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Exercício no builder */
.builder-ex-item{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.builder-ex-name{font-size:14px;flex:1}
.builder-ex-meta{font-size:11px;color:var(--text3);margin-top:2px}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#111;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err-toast{background:var(--red);color:#fff}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none}
.modal-backdrop.open{display:block}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:20px;z-index:501;max-height:85vh;overflow-y:auto;display:none}
.modal-sheet.open{display:block}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}

/* Histórico */
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.history-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.history-name{font-weight:600;font-size:15px}
.history-date{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
.history-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 9px;background:var(--surface2);border-radius:99px;color:var(--text2)}
.tag.accent{background:rgba(200,245,66,.12);color:var(--accent)}
.tag.blue{background:rgba(92,159,255,.12);color:var(--blue)}

/* Evolução */
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-value{font-size:22px;font-weight:600;color:var(--accent);font-family:'DM Mono',monospace}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.chart-title{font-size:13px;font-weight:500;margin-bottom:12px;color:var(--text2)}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;background:var(--surface2);border-radius:4px 4px 0 0;min-height:4px}
.bar.has-data{background:var(--accent);opacity:.8}
.bar.today{background:var(--accent)}
.bar-label{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;line-height:1.6}
.empty-icon{font-size:36px;margin-bottom:10px}
.log-ex-item{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px}
.log-ex-name{font-weight:600;font-size:14px;margin-bottom:6px}
.log-serie-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);margin-bottom:3px}
.academia-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.academia-list-item:last-child{border-bottom:none}
select option{background:#1a1a1a}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="logo">MEUS_TREINOS.APP</span>
    <div class="streak"><div class="streak-dot"></div><span id="streak-count">0 dias</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="goTab('hoje')">Hoje</button>
    <button class="tab" onclick="goTab('treino')">Treino</button>
    <button class="tab" onclick="goTab('registrar')">+ Log</button>
    <button class="tab" onclick="goTab('historico')">Histórico</button>
    <button class="tab" onclick="goTab('evolucao')">Evolução</button>
  </div>
</div>

<div class="section active" id="tab-hoje"><div id="hoje-content"></div></div>
<div class="section" id="tab-treino"><div id="treino-content"></div></div>

<!-- LOG -->
<div class="section" id="tab-registrar">
  <p class="section-title">Registrar exercício</p>
  <div id="cloud-bar-reg"></div>
  <div class="card">
    <div class="form-group">
      <label class="form-label">Academia</label>
      <div class="academia-row">
        <select class="form-select" id="r-academia"><option value="">Selecione…</option></select>
        <button class="btn-icon" onclick="abrirModalAcademias()">⚙</button>
      </div>
    </div>

    <!-- Grupo muscular -->
    <div class="form-group">
      <label class="form-label">Grupo muscular</label>
      <select class="form-select" id="r-grupo" onchange="onGrupoChange()">
        <option value="">Selecione…</option>
        <option>Peito</option><option>Costas</option><option>Ombros</option>
        <option>Bíceps</option><option>Tríceps</option><option>Pernas</option>
        <option>Glúteos</option><option>Abdômen</option><option>Cardio</option>
      </select>
    </div>

    <!-- Exercício = select curto + botão adicionar novo -->
    <div class="form-group" id="ex-group" style="display:none">
      <label class="form-label">Exercício</label>
      <div class="ex-select-row">
        <select class="form-select" id="r-exercicio"><option value="">Selecione…</option></select>
        <button class="btn-add-ex" onclick="abrirModalNovoEx()" title="Adicionar exercício">+</button>
      </div>
    </div>

    <!-- Séries -->
    <div class="form-group">
      <label class="form-label">Séries realizadas <span style="color:var(--text3);font-weight:400">(toque no tipo para trocar)</span></label>
      <table class="series-table">
        <thead><tr><th style="width:95px">Tipo</th><th>Reps</th><th>Kg</th><th style="width:28px"></th></tr></thead>
        <tbody id="series-tbody"></tbody>
      </table>
      <button class="add-serie-btn" onclick="addSerieRow()">
        <span class="plus">+</span> Adicionar série
      </button>
    </div>

    <div class="form-group">
      <label class="form-label">Observações (opcional)</label>
      <input class="form-input" id="r-obs" placeholder="Ex: aumentei 2.5kg, senti dor…">
    </div>
    <button class="btn-primary" id="btn-salvar" onclick="salvarRegistro()">Salvar exercício</button>
  </div>
</div>

<div class="section" id="tab-historico">
  <p class="section-title">Seus treinos</p>
  <div id="historico-content"></div>
</div>

<div class="section" id="tab-evolucao">
  <p class="section-title">Resumo geral</p>
  <div class="stat-row">
    <div class="stat-box"><div class="stat-value" id="st-total">0</div><div class="stat-label">Treinos</div></div>
    <div class="stat-box"><div class="stat-value" id="st-semana">0</div><div class="stat-label">Esta semana</div></div>
    <div class="stat-box"><div class="stat-value" id="st-exercicios">0</div><div class="stat-label">Exercícios</div></div>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">Treinos nos últimos 7 dias</div>
    <div class="bar-chart" id="bar-chart"></div>
  </div>
  <p class="section-title" style="margin-top:8px">Evolução por exercício</p>
  <div id="filtro-academia-wrap" style="margin-bottom:12px"></div>
  <div id="evolucao-exercicios"></div>
</div>

<!-- Modal: adicionar novo exercício -->
<div class="modal-backdrop" id="bd-novoex" onclick="fecharModalNovoEx()"></div>
<div class="modal-sheet" id="ms-novoex">
  <div class="modal-title">Novo exercício <button class="modal-close" onclick="fecharModalNovoEx()">✕</button></div>
  <div class="form-group">
    <label class="form-label">Grupo muscular</label>
    <select class="form-select" id="novoex-grupo">
      <option>Peito</option><option>Costas</option><option>Ombros</option>
      <option>Bíceps</option><option>Tríceps</option><option>Pernas</option>
      <option>Glúteos</option><option>Abdômen</option><option>Cardio</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Nome do exercício</label>
    <input class="form-input" id="novoex-nome" placeholder="Ex: Búlgaro, Hack squat…" autocomplete="off">
  </div>
  <button class="btn-primary" style="margin-top:0" onclick="salvarNovoEx()">Adicionar exercício</button>
</div>

<!-- Modal: criar / editar treino -->
<div class="modal-backdrop" id="bd-builder" onclick="fecharBuilder()"></div>
<div class="modal-sheet" id="ms-builder">
  <div class="modal-title"><span id="builder-title">Novo treino</span> <button class="modal-close" onclick="fecharBuilder()">✕</button></div>
  <div class="form-group">
    <label class="form-label">Nome do treino</label>
    <input class="form-input" id="builder-nome" placeholder="Ex: Treino E, Peito pesado…">
  </div>
  <div class="form-group">
    <label class="form-label">Grupos musculares (separados por vírgula)</label>
    <input class="form-input" id="builder-grupos" placeholder="Ex: Peito, Tríceps">
  </div>

  <p class="section-title" style="margin-top:4px">Exercícios do treino</p>
  <div id="builder-ex-list"></div>

  <!-- Adicionar exercício ao treino -->
  <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px">
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <select class="form-select" id="builder-add-grupo" onchange="renderBuilderExSelect()" style="flex:1">
        <option value="">Grupo…</option>
        <option>Peito</option><option>Costas</option><option>Ombros</option>
        <option>Bíceps</option><option>Tríceps</option><option>Pernas</option>
        <option>Glúteos</option><option>Abdômen</option><option>Cardio</option>
      </select>
      <select class="form-select" id="builder-add-ex" style="flex:2"><option value="">Exercício…</option></select>
    </div>
    <p style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:6px;letter-spacing:.04em">SÉRIES DO EXERCÍCIO</p>
    <table class="series-table" style="margin-bottom:6px">

function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err-toast':'');t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}
let currentTab='hoje';
function goTab(tab){
  currentTab=tab;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  ['hoje','treino','registrar','historico','evolucao'].forEach((t,i)=>{if(t===tab)document.querySelectorAll('.tab')[i].classList.add('active');});
  if(tab==='registrar'){populaSelectAcademia();if(!document.querySelector('#series-tbody tr'))addSerieRow();setCloud('idle');}
  render();
}

function onGrupoChange(){
  const grupo=document.getElementById('r-grupo').value;
  const grp=document.getElementById('ex-group');
  const sel=document.getElementById('r-exercicio');
  if(!grupo){grp.style.display='none';return;}
  grp.style.display='block';
  const lista=getExercicios(grupo);
  sel.innerHTML='<option value="">Selecione…</option>'+lista.map(e=>`<option value="${e}">${e}</option>`).join('');
  // pré-seleciona o grupo no modal de novo exercício
  document.getElementById('novoex-grupo').value=grupo;
}

function abrirModalNovoEx(){
  const grupo=document.getElementById('r-grupo').value;
  if(grupo) document.getElementById('novoex-grupo').value=grupo;
  document.getElementById('novoex-nome').value='';
  document.getElementById('bd-novoex').classList.add('open');
  document.getElementById('ms-novoex').classList.add('open');
  setTimeout(()=>document.getElementById('novoex-nome').focus(),100);
}
function fecharModalNovoEx(){
  document.getElementById('bd-novoex').classList.remove('open');
  document.getElementById('ms-novoex').classList.remove('open');
}
function salvarNovoEx(){
  const grupo=document.getElementById('novoex-grupo').value;
  const nome=document.getElementById('novoex-nome').value.trim();
  if(!nome){showToast('Digite o nome do exercício',true);return;}
  const custom=loadExCustom();
  if(!custom[grupo]) custom[grupo]=[];
  if(custom[grupo].includes(nome)){showToast('Exercício já existe',true);return;}
  custom[grupo].push(nome);
  saveExCustom(custom);
  fecharModalNovoEx();
  // Atualiza o select do log se o grupo for o mesmo
  const grupoAtual=document.getElementById('r-grupo').value;
  if(grupoAtual===grupo) onGrupoChange();
  // Seleciona o novo exercício automaticamente
  setTimeout(()=>{
    const sel=document.getElementById('r-exercicio');
    for(let o of sel.options){if(o.value===nome){o.selected=true;break;}}
  },50);
  showToast(`✓ "${nome}" adicionado`);
}
document.getElementById('novoex-nome').addEventListener('keydown',e=>{if(e.key==='Enter')salvarNovoEx();});

let serieCounter=0;
const TIPOS=['trabalho','aquecimento','ajuste'];
function addSerieRow(tipo='trabalho',reps='',kg=''){
  const id='s'+(++serieCounter);
  const tr=document.createElement('tr');tr.id='row-'+id;
  tr.innerHTML=`<td><span class="tipo-pill ${tipo}" id="pill-${id}" onclick="cycleTipo('${id}')">${tipo}</span></td>
    <td><input class="mini-input" id="reps-${id}" type="number" min="1" placeholder="reps" value="${reps}"></td>
    <td><input class="mini-input" id="kg-${id}" type="number" min="0" step="0.5" placeholder="kg" value="${kg}"></td>
    <td><button class="remove-serie" onclick="removeSerieRow('${id}')">×</button></td>`;
  document.getElementById('series-tbody').appendChild(tr);
}
function cycleTipo(id){const p=document.getElementById('pill-'+id);const n=TIPOS[(TIPOS.indexOf(p.textContent)+1)%TIPOS.length];p.textContent=n;p.className='tipo-pill '+n;}
function removeSerieRow(id){document.getElementById('row-'+id)?.remove();}
function getSeriesFromTable(){
  return[...document.querySelectorAll('#series-tbody tr')].reduce((a,row)=>{
    const id=row.id.replace('row-','');
    const tipo=document.getElementById('pill-'+id)?.textContent||'trabalho';
    const reps=parseInt(document.getElementById('reps-'+id)?.value);
    const kg=parseFloat(document.getElementById('kg-'+id)?.value)||0;
    if(reps) a.push({tipo,reps,kg});
    return a;
  },[]);
}

// ══════════════════════════════════════
async function salvarRegistro(){
  const exercicio=document.getElementById('r-exercicio').value;
  const academia=document.getElementById('r-academia').value;
  const grupo=document.getElementById('r-grupo').value;
  const obs=document.getElementById('r-obs').value.trim();
  const series=getSeriesFromTable();
  if(!exercicio){showToast('Selecione um exercício',true);return;}
  if(!series.length){showToast('Adicione pelo menos uma série',true);return;}
  const reg={id:Date.now(),data:today(),exercicio,academia,grupo,series,obs};
  const local=loadLocal();local.unshift(reg);saveLocal(local);
  const btn=document.getElementById('btn-salvar');
  btn.disabled=true;btn.textContent='Salvando…';setCloud('syncing');
  try{
    await sbFetch('/rest/v1/treinos',{method:'POST',body:JSON.stringify({id:reg.id,data:reg.data,exercicio,academia:academia||null,grupo:grupo||null,series,obs:obs||null})});
    setCloud('ok');showToast('✓ Salvo na nuvem!');
  }catch{setCloud('err');showToast('Salvo localmente',true);}
  btn.disabled=false;btn.textContent='Salvar exercício';
  // reset
  document.getElementById('r-exercicio').value='';
  document.getElementById('r-grupo').value='';
  document.getElementById('r-obs').value='';
  document.getElementById('ex-group').style.display='none';
  document.getElementById('series-tbody').innerHTML='';serieCounter=0;addSerieRow();
  setTimeout(()=>goTab('hoje'),800);
}

function populaSelectAcademia(){const s=document.getElementById('r-academia');const v=s.value;s.innerHTML='<option value="">Selecione…</option>'+loadAcademias().map(a=>`<option value="${a}">${a}</option>`).join('');if(v)s.value=v;}
function abrirModalAcademias(){renderListaAcademias();document.getElementById('bd-academias').classList.add('open');document.getElementById('ms-academias').classList.add('open');}
function fecharModalAcademias(){document.getElementById('bd-academias').classList.remove('open');document.getElementById('ms-academias').classList.remove('open');populaSelectAcademia();}
function renderListaAcademias(){const a=loadAcademias();document.getElementById('lista-academias').innerHTML=a.length?a.map((x,i)=>`<div class="academia-list-item"><span>${x}</span><button class="btn-danger" onclick="removerAcademia(${i})">Remover</button></div>`).join(''):`<div style="color:var(--text3);font-size:13px;padding:8px 0">Nenhuma academia cadastrada.</div>`;}
function adicionarAcademia(){const i=document.getElementById('nova-academia');const n=i.value.trim();if(!n)return;const a=loadAcademias();if(a.includes(n)){showToast('Academia já cadastrada',true);return;}a.push(n);saveAcademias(a);i.value='';renderListaAcademias();showToast('✓ Academia adicionada');}
function removerAcademia(i){const a=loadAcademias();a.splice(i,1);saveAcademias(a);renderListaAcademias();}
document.getElementById('nova-academia').addEventListener('keydown',e=>{if(e.key==='Enter')adicionarAcademia();});

// ══════════════════════════════════════
// BUILDER DE TREINO CUSTOMIZADO
// ══════════════════════════════════════
let builderExercicios=[];
let editandoTreinoId=null;

function abrirBuilder(id=null){
  builderExercicios=[];
  editandoTreinoId=id;
  if(id){
    const t=loadTreinosCustom().find(x=>x.id===id);
    if(t){
      document.getElementById('builder-nome').value=t.nome;
      document.getElementById('builder-grupos').value=t.grupos.join(', ');
      builderExercicios=[...t.exercicios];
      document.getElementById('builder-title').textContent='Editar treino';
    }
  } else {
    document.getElementById('builder-nome').value='';
    document.getElementById('builder-grupos').value='';
    document.getElementById('builder-title').textContent='Novo treino';
  }
  // Inicializa tabela de séries do builder
  document.getElementById('builder-series-tbody').innerHTML='';
  builderSerieCounter=0;
  addBuilderSerieRow();
  renderBuilderExList();
  document.getElementById('bd-builder').classList.add('open');
  document.getElementById('ms-builder').classList.add('open');
}
function fecharBuilder(){
  document.getElementById('bd-builder').classList.remove('open');
  document.getElementById('ms-builder').classList.remove('open');
}

function renderBuilderExSelect(){
  const grupo=document.getElementById('builder-add-grupo').value;
  const sel=document.getElementById('builder-add-ex');
  sel.innerHTML='<option value="">Exercício…</option>';
  if(!grupo) return;
  getExercicios(grupo).forEach(e=>{sel.innerHTML+=`<option value="${e}">${e}</option>`;});
}

// Tabela de séries dentro do builder
let builderSerieCounter=0;
function addBuilderSerieRow(tipo='trabalho',qtd='1',reps=''){
  const id='bs'+(++builderSerieCounter);
  const tr=document.createElement('tr');tr.id='brow-'+id;
  tr.innerHTML=`<td><span class="tipo-pill ${tipo}" id="bpill-${id}" onclick="cycleBuilderTipo('${id}')">${tipo}</span></td>
    <td><input class="mini-input" id="bqtd-${id}" type="number" min="1" placeholder="qtd" value="${qtd}" style="max-width:52px"></td>
    <td><input class="mini-input" id="breps-${id}" placeholder="6-10" value="${reps}"></td>
    <td><button class="remove-serie" onclick="document.getElementById('brow-${id}').remove()">×</button></td>`;
  document.getElementById('builder-series-tbody').appendChild(tr);
}
function cycleBuilderTipo(id){
  const p=document.getElementById('bpill-'+id);
  const n=TIPOS[(TIPOS.indexOf(p.textContent)+1)%TIPOS.length];
  p.textContent=n;p.className='tipo-pill '+n;
}
function getBuilderSeries(){
  return[...document.querySelectorAll('#builder-series-tbody tr')].reduce((a,row)=>{
    const id=row.id.replace('brow-','');
    const tipo=document.getElementById('bpill-'+id)?.textContent||'trabalho';
    const qtd=document.getElementById('bqtd-'+id)?.value||'1';
    const reps=document.getElementById('breps-'+id)?.value||'';
    if(reps) a.push({tipo,s:qtd,r:reps});
    return a;
  },[]);
}

function addExAoBuilder(){
  const grupo=document.getElementById('builder-add-grupo').value;
  const ex=document.getElementById('builder-add-ex').value;
  const obs=document.getElementById('builder-obs').value.trim();
  if(!ex){showToast('Selecione um exercício',true);return;}
  const series=getBuilderSeries();
  if(!series.length){showToast('Adicione pelo menos uma série',true);return;}
  // adiciona obs na última série
  if(obs) series[series.length-1].obs=obs;
  builderExercicios.push({nome:ex,grupo,series});
  // reset campos
  document.getElementById('builder-add-ex').value='';
  document.getElementById('builder-obs').value='';
  document.getElementById('builder-series-tbody').innerHTML='';
  builderSerieCounter=0;
  addBuilderSerieRow();
  renderBuilderExList();
  showToast('✓ Exercício adicionado');
}

function renderBuilderExList(){
  const cont=document.getElementById('builder-ex-list');
  if(!builderExercicios.length){
    cont.innerHTML=`<div style="color:var(--text3);font-size:13px;padding:8px 0 12px">Nenhum exercício adicionado ainda.</div>`;
    return;
  }
  cont.innerHTML=builderExercicios.map((ex,i)=>`
    <div class="builder-ex-item">
      <div>
        <div class="builder-ex-name">${ex.nome}</div>
        <div class="builder-ex-meta">${ex.grupo} · ${ex.series.map(s=>s.s+'×'+s.r).join(', ')}</div>
      </div>
      <button class="btn-danger" onclick="removeExDoBuilder(${i})">×</button>
    </div>`).join('');
}

function removeExDoBuilder(i){builderExercicios.splice(i,1);renderBuilderExList();}

function salvarTreinoCustom(){
  const nome=document.getElementById('builder-nome').value.trim();
  const gruposStr=document.getElementById('builder-grupos').value.trim();
  if(!nome){showToast('Dê um nome ao treino',true);return;}
  // Auto-confirma exercício pendente se houver grupo+exercício preenchidos
  const exPendente=document.getElementById('builder-add-ex').value;
  if(exPendente) addExAoBuilder();
  if(!builderExercicios.length){showToast('Adicione pelo menos um exercício',true);return;}
  const grupos=gruposStr?gruposStr.split(',').map(g=>g.trim()).filter(Boolean):['Personalizado'];
  const treinos=loadTreinosCustom();
  if(editandoTreinoId){
    const idx=treinos.findIndex(t=>t.id===editandoTreinoId);
    if(idx>=0) treinos[idx]={...treinos[idx],nome,grupos,exercicios:builderExercicios};
  } else {
    treinos.push({id:'C'+Date.now(),nome,grupos,exercicios:builderExercicios});
  }
  saveTreinosCustom(treinos);
  fecharBuilder();
  showToast(`✓ "${nome}" salvo!`);
  render();
}

function excluirTreinoCustom(id){
  const treinos=loadTreinosCustom().filter(t=>t.id!==id);
  saveTreinosCustom(treinos);
  if(treinoAtivo===id) treinoAtivo='A';
  render();
  showToast('Treino removido');
}

// ══════════════════════════════════════
// RENDER HOJE
// ══════════════════════════════════════
function renderHoje(){
  const data=loadLocal(),hoje=today(),regs=data.filter(r=>r.data===hoje);
  const grupos=[...new Set(regs.map(r=>r.grupo).filter(Boolean))];
  const acs=[...new Set(regs.map(r=>r.academia).filter(Boolean))];
  const diaAtual=getDiaHoje();
  const todos=getTodosTreinos();
  const plano=diaAtual?todos[diaAtual]:null;
  const diasNome=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const vol=regs.reduce((s,r)=>s+(r.series||[]).reduce((ss,sr)=>ss+(sr.reps*(sr.kg||0)),0),0);
  const meta=plano?plano.exercicios.length:4;
  const pct=Math.min(100,Math.round((regs.length/meta)*100));

  // Botões de seleção: ABCD fixos + treinos custom
  const custom=loadTreinosCustom();
  let diasBtns=['A','B','C','D'].map(t=>`<button class="dia-btn${diaAtual===t?' active':''}" onclick="mudarDia('${t}')">${PLANO_FIXO[t].nome}</button>`).join('');
  custom.forEach(t=>{diasBtns+=`<button class="dia-btn${diaAtual===t.id?' active':''}" onclick="mudarDia('${t.id}')">${t.nome}</button>`;});
  diasBtns+=`<button class="dia-btn descanso-btn${diaAtual===null?' active':''}" onclick="mudarDia(null)">😴 Descanso</button>`;

  let html=`<div style="margin-bottom:4px">
    <div class="day-label">${diasNome[new Date().getDay()]} · ${formatDate(hoje)}</div>
    <div class="workout-title">${plano?plano.nome:(regs.length?grupos.join(' + ')||'Treino livre':'Descanso 😴')}</div>
    ${plano?`<div class="workout-meta" style="color:var(--orange)">${plano.grupos.join(' · ')}</div>`:''}
    ${acs.length?`<div class="workout-meta" style="color:var(--blue)">📍 ${acs.join(', ')}</div>`:''}
    <div class="workout-meta">${regs.length} exercício${regs.length!==1?'s':''} registrado${regs.length!==1?'s':''}</div>
    ${vol>0?`<div class="workout-meta" style="color:var(--accent)">Volume: ${Math.round(vol).toLocaleString('pt-BR')} kg</div>`:''}
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>${regs.length}/${meta} exercícios</span><span>${pct}%</span></div>
  </div>
  <p class="section-title" style="margin-top:16px">Qual é o treino de hoje?</p>
  <div class="dia-selector">${diasBtns}</div>`;

  if(regs.length){
    html+=`<p class="section-title">Registrado hoje</p>`;
    regs.forEach(r=>{
      html+=`<div class="log-ex-item">
        <div class="log-ex-name">${r.exercicio}</div>
        ${(r.series||[]).map(s=>`<div class="log-serie-row"><span class="tipo-pill ${s.tipo}" style="cursor:default">${s.tipo}</span><span>${s.reps} reps${s.kg?' · '+s.kg+'kg':''}</span></div>`).join('')}
        ${r.obs?`<div style="font-size:12px;color:var(--text3);margin-top:6px">💬 ${r.obs}</div>`:''}
      </div>`;
    });
    html+=`<div style="margin-top:4px"><button class="btn-ghost" onclick="goTab('registrar')">+ Adicionar exercício</button></div>`;
  } else if(plano){
    html+=`<div style="margin-top:8px"><button class="btn-primary" style="margin-top:0" onclick="goTab('treino')">Ver treino do dia →</button></div>`;
  }
  document.getElementById('hoje-content').innerHTML=html;
}
function mudarDia(t){setDiaHoje(t);renderHoje();const todos=getTodosTreinos();showToast(t?`${todos[t]?.nome||t} selecionado`:'Descanso marcado 😴');}

// ══════════════════════════════════════
// RENDER TREINO (checklist + criador)
// ══════════════════════════════════════
let treinoAtivo=getDiaHoje()||'A';
function renderTreino(){
  const checks=loadChecks(),todayKey=today(),diaHoje=getDiaHoje();
  if(!treinoAtivo) treinoAtivo='A';
  const todos=getTodosTreinos();
  const custom=loadTreinosCustom();
  if(!todos[treinoAtivo]) treinoAtivo='A';
  const plano=todos[treinoAtivo];
  const doneCount=plano.exercicios.filter((_,i)=>checks[`${todayKey}_${treinoAtivo}_${i}`]).length;
  const pct=Math.round(doneCount/plano.exercicios.length*100);
  const isCustom=!!custom.find(t=>t.id===treinoAtivo);

  const playIcon=`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M8 5v14l11-7z"/></svg>`;

  // Tabs de treinos
  let tabs=['A','B','C','D'].map(t=>`<button class="dia-btn${treinoAtivo===t?' active':''}" style="flex-shrink:0;padding:7px 12px;font-size:12px" onclick="setTreinoAtivo('${t}')">${PLANO_FIXO[t].nome}${diaHoje===t?' ·':''}</button>`).join('');
  custom.forEach(t=>{tabs+=`<button class="dia-btn${treinoAtivo===t.id?' active':''}" style="flex-shrink:0;padding:7px 12px;font-size:12px" onclick="setTreinoAtivo('${t.id}')">${t.nome}</button>`;});
  tabs+=`<button class="dia-btn" style="flex-shrink:0;padding:7px 14px;font-size:20px;line-height:1;color:var(--accent);border-color:rgba(200,245,66,.3)" onclick="abrirBuilder()" title="Criar novo treino">+</button>`;

  let html=`<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;-webkit-overflow-scrolling:touch">${tabs}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div>
        <div style="font-weight:600;font-size:15px">${plano.nome}</div>
        <div style="font-size:12px;color:var(--text2)">${plano.grupos.join(' · ')}</div>
      </div>
      <div style="display:flex;gap:6px">
        ${isCustom?`<button class="btn-ghost" style="font-size:12px;padding:6px 10px" onclick="abrirBuilder('${treinoAtivo}')">✏️</button>
        <button class="btn-danger" style="padding:6px 10px" onclick="excluirTreinoCustom('${treinoAtivo}')">🗑</button>`:''}
      </div>
    </div>
    <div class="progress-bar-wrap" style="margin-bottom:6px"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="progress-label" style="margin-bottom:16px"><span>${doneCount}/${plano.exercicios.length} concluídos</span><span>${pct}%</span></div>`;

  plano.exercicios.forEach((ex,i)=>{
    const chKey=`${todayKey}_${treinoAtivo}_${i}`,done=!!checks[chKey];
    html+=`<div class="ex-card${done?' done-card':''}">
      <div class="ex-header">
        <div class="ex-name">${ex.nome}</div>
        <button class="ex-check-btn${done?' done':''}" onclick="toggleCheck('${chKey}')">${done?'✓':''}</button>
      </div>
      <div class="series-row">${ex.series.map(s=>`<span class="serie-badge serie-${s.tipo}">${s.s}×${s.r} ${s.tipo==='aquecimento'?'aquec.':s.tipo}</span>`).join('')}</div>
      ${ex.series.filter(s=>s.obs).map(s=>`<span class="note-badge">💡 ${s.obs}</span>`).join('')}
      <div class="ex-actions">
        <button class="btn-ghost" style="font-size:12px;padding:6px 12px" onclick="prefillLog('${ex.nome.replace(/'/g,"\\'")}','${ex.grupo||''}',${i})">+ Registrar carga</button>
        ${ex.video?`<a class="btn-video" href="${ex.video}" target="_blank" rel="noopener">${playIcon} Ver vídeo</a>`:''}
      </div>
    </div>`;
  });



  document.getElementById('treino-content').innerHTML=html;
}
function setTreinoAtivo(t){treinoAtivo=t;renderTreino();}
function toggleCheck(key){const c=loadChecks();c[key]=!c[key];saveChecks(c);renderTreino();}
function prefillLog(nome,grupo,idx){
  // preenche o grupo
  const selGrupo=document.getElementById('r-grupo');
  selGrupo.value=grupo;
  onGrupoChange();
  setTimeout(()=>{
    document.getElementById('r-exercicio').value=nome;
    document.getElementById('series-tbody').innerHTML='';serieCounter=0;
    const todos=getTodosTreinos();
    const ex=todos[treinoAtivo]?.exercicios[idx];
    if(ex) ex.series.forEach(s=>{for(let i=0;i<(parseInt(s.s)||1);i++)addSerieRow(s.tipo,'','');});
    else addSerieRow();
  },50);
  goTab('registrar');
}

// ══════════════════════════════════════
// HISTÓRICO
// ══════════════════════════════════════
function renderHistorico(){
  const data=loadLocal(),cont=document.getElementById('historico-content');
  if(!data.length){cont.innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><div>Nenhum treino registrado ainda.</div></div>`;return;}
  const porData={};data.forEach(r=>{if(!porData[r.data])porData[r.data]=[];porData[r.data].push(r);});
  cont.innerHTML=Object.keys(porData).sort((a,b)=>b.localeCompare(a)).map(d=>{
    const items=porData[d];
    const grupos=[...new Set(items.map(r=>r.grupo).filter(Boolean))];
    const acs=[...new Set(items.map(r=>r.academia).filter(Boolean))];
    const vol=items.reduce((s,r)=>s+(r.series||[]).reduce((ss,sr)=>ss+(sr.reps*(sr.kg||0)),0),0);
    return `<div class="history-item">
      <div class="history-header">
        <div><div class="history-name">${diaSem(d)}${d===today()?' (hoje)':''} · ${grupos.join(', ')||'Treino'}</div>
        <div class="history-date">${formatDate(d)} · ${items.length} exercícios</div></div>
        ${vol>0?`<div style="font-size:12px;color:var(--accent);font-family:'DM Mono',monospace">${Math.round(vol).toLocaleString('pt-BR')}kg</div>`:''}
      </div>
      <div class="history-tags">
        ${acs.map(a=>`<span class="tag blue">📍 ${a}</span>`).join('')}
        ${grupos.map(g=>`<span class="tag accent">${g}</span>`).join('')}
        ${items.map(r=>`<span class="tag">${r.exercicio}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════
// EVOLUÇÃO
// ══════════════════════════════════════
let filtroAc='';
function setFiltroAc(a){filtroAc=a;renderEvolucao();}
function renderEvolucao(){
  const data=loadLocal(),acs=loadAcademias();
  const porData={};data.forEach(r=>{if(!porData[r.data])porData[r.data]=[];porData[r.data].push(r);});
  const dias=Object.keys(porData);
  const umaSem=new Date();umaSem.setDate(umaSem.getDate()-6);
  document.getElementById('st-total').textContent=dias.length;
  document.getElementById('st-semana').textContent=dias.filter(d=>new Date(d+'T12:00:00')>=umaSem).length;
  document.getElementById('st-exercicios').textContent=data.length;
  let streak=0,sorted=[...dias].sort((a,b)=>b.localeCompare(a));
  if(sorted.length){let cur=new Date();cur.setHours(0,0,0,0);for(let d of sorted){const dt=new Date(d+'T12:00:00');dt.setHours(0,0,0,0);if(Math.round((cur-dt)/86400000)<=1){streak++;cur=dt;}else break;}}
  document.getElementById('streak-count').textContent=streak+(streak===1?' dia':' dias');
  const chart=document.getElementById('bar-chart');chart.innerHTML='';
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);const count=(porData[key]||[]).length;const h=count>0?Math.max(12,Math.round((count/8)*70)):4;chart.innerHTML+=`<div class="bar-group"><div class="bar${count>0?(i===0?' today':' has-data'):''}" style="height:${h}px"></div><span class="bar-label">${diaSem(key)}</span></div>`;}
  const fw=document.getElementById('filtro-academia-wrap');
  fw.innerHTML=acs.length>1?`<div style="display:flex;gap:6px;flex-wrap:wrap">${['Todas',...acs].map(a=>`<span style="padding:5px 11px;font-size:12px;background:var(--surface2);border:1px solid ${(a==='Todas'?filtroAc==='':filtroAc===a)?'var(--accent)':'var(--border)'};border-radius:99px;cursor:pointer;color:${(a==='Todas'?filtroAc==='':filtroAc===a)?'var(--accent)':'var(--text2)'}" onclick="setFiltroAc('${a==='Todas'?'':a}')">${a}</span>`).join('')}</div>`:'';
  const filt=filtroAc?data.filter(r=>r.academia===filtroAc):data;
  const porEx={};
  filt.forEach(r=>{const st=(r.series||[]).filter(s=>s.tipo==='trabalho'&&s.kg>0);if(!st.length)return;if(!porEx[r.exercicio])porEx[r.exercicio]=[];porEx[r.exercicio].push({data:r.data,carga:Math.max(...st.map(s=>s.kg))});});
  const exs=Object.keys(porEx);
  if(!exs.length){document.getElementById('evolucao-exercicios').innerHTML=`<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Registre cargas para ver a evolução</div>`;return;}
  document.getElementById('evolucao-exercicios').innerHTML=exs.slice(0,10).map(ex=>{
    const arr=porEx[ex].sort((a,b)=>a.data.localeCompare(b.data));
    const primeiro=arr[0].carga,ultimo=arr[arr.length-1].carga,maximo=Math.max(...arr.map(r=>r.carga));
    const diff=ultimo-primeiro;const cor=diff>0?'var(--accent)':diff<0?'var(--red)':'var(--text2)';
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-weight:500;font-size:14px">${ex}</div>
        <div style="font-size:13px;color:${cor};font-family:'DM Mono',monospace">${diff>=0?'+':''}${diff.toFixed(1)}kg</div>
      </div>
      <div style="font-size:12px;color:var(--text2);display:flex;gap:16px">
        <span>Início: ${primeiro}kg</span><span>Atual: ${ultimo}kg</span><span style="color:var(--accent)">Máx: ${maximo}kg</span>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════
// RENDER + INIT
// ══════════════════════════════════════
function render(){
  if(currentTab==='hoje') renderHoje();
  else if(currentTab==='treino') renderTreino();
  else if(currentTab==='historico') renderHistorico();
  else if(currentTab==='evolucao') renderEvolucao();
}

(async()=>{
  populaSelectAcademia();addSerieRow();render();
  try{
    const rows=await sbFetch('/rest/v1/treinos?select=*&order=id.desc');
    if(rows?.length){
      const local=loadLocal();const idsR=new Set(rows.map(r=>r.id));
      const soLocal=local.filter(r=>!idsR.has(r.id));
      const merged=[...soLocal,...rows.map(r=>({id:r.id,data:r.data,exercicio:r.exercicio,academia:r.academia||'',grupo:r.grupo||'',series:r.series||[],obs:r.obs||''}))].sort((a,b)=>b.id-a.id);
      saveLocal(merged);render();
      if(rows.length!==local.length) showToast(`☁ ${rows.length} registros sincronizados`);
    }
  }catch(e){console.warn('Sync:',e);}
})();
